name: Deploy dashboard (GitHub Pages)

on:
  # Redeploy whenever the dashboard code changes (manual pushes / merges).
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy.yml"
  # The daily radar commits data using the built-in GITHUB_TOKEN, whose
  # pushes deliberately do NOT trigger other workflows — so a plain `push`
  # trigger on data/jobs.json would never fire for the automated run.
  # workflow_run chains off the radar's completion instead, regardless of
  # how the radar was triggered (schedule or manual), so fresh jobs always
  # publish.
  workflow_run:
    workflows: ["Job Radar (daily)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deploy; let queued data updates publish in order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: dashboard
        run: npm install

      - name: Build (prebuild copies ../data/jobs.json into the bundle)
        working-directory: dashboard
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
